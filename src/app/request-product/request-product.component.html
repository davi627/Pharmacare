<div class="container">
    <h1>Order Form</h1>
    <form>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your name" name="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="text" placeholder="Enter phone number"  name="phone" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="text" placeholder="Enter Email"  name="email" required>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" placeholder="Enter your address" name="address" rows="3"></textarea>
      </div>
      <div class="products">
        <div  class="product-group">
          <div class="form-group">
            <label for="">Product</label>
            <input id="" type="text" placeholder="Enter product name"  name="">
          </div>
          <div class="form-group">
            <label for="">Quantity</label>
            <input id="" type="number" placeholder="Enter quantity"  name="">
          </div>
          <button type="button" class="remove-product" >Remove</button>
        </div>
        <button type="button" class="add-product" >+ Add Another Product</button>
      </div>
      <button type="submit" class="send-button" >Send</button>
    </form>
  </div>
