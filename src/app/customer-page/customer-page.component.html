<div class="Customers-page">
    <div class="navbar">
      <div class="profile-icon">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="list">
        <ul>
          <li (click)="showForm('booking')">Book Appointments</li>
          <li (click)="showForm('upload')">Upload Prescriptions</li>
          <li (click)="showForm('appointments')">Appointments</li>
        </ul>
        <div class="settings-icon">
          <i class="fas fa-cog"></i>
        </div>
      </div>
    </div>
  
    <!-- Booking Form -->
    <div *ngIf="currentForm === 'booking'" id="booking-form">
      <form (ngSubmit)="submitForm()">
        <label for="name">Name:</label>
        <input type="text" id="name" [(ngModel)]="appointment.name" name="name" required />
    
        <label for="age">Age:</label>
        <input type="number" id="age" [(ngModel)]="appointment.age" name="age" required />
    
        <label for="gender">Gender:</label>
        <select id="gender" [(ngModel)]="appointment.gender" name="gender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
    
        <label for="date">Date:</label>
        <input type="date" id="date" [(ngModel)]="appointment.date" name="date" required />
    
        <label for="reason">Reason:</label>
        <textarea id="reason" [(ngModel)]="appointment.reason" name="reason" rows="4" required></textarea>
    
        <button type="submit">Submit</button>
      </form>
    </div>
    

    <!-- Upload Prescriptions Form -->
    <div *ngIf="currentForm === 'upload'" id="upload-prescription-form" >
      <form (ngSubmit)="submitPrescription()">
        <label for="patientName">Patient Name:</label>
        <input type="text" id="patientNames" name="patientsName" [(ngModel)]="prescription.patientsName" placeholder="Enter patient's name" required />
  
        <label for="patientAge">Patient Age:</label>
        <input type="number" id="patientAge" name="patientAge" [(ngModel)]="prescription.age" placeholder="Enter patient's age" required />
  
        <label for="doctorName">Doctor's Name:</label>
        <input type="text" id="doctorName" name="doctorName" [(ngModel)]="prescription.doctorName" placeholder="Enter doctor's name" />
  
        <label for="prescriptionDate">Date of Prescription:</label>
        <input type="date" id="date" name="date"  [(ngModel)]="prescription.date"required />
  
        <label for="fileUpload">Upload Prescription:</label>
        <input type="file" id="fileUpload" name="fileUpload" accept=".pdf,.jpg,.png" (change)="onFileSelected($event)" required />

  
        <label for="additionalNotes">Additional Notes:</label>
        <textarea id="notes" name="notes" rows="4" [(ngModel)]="prescription.notes" placeholder="Provide any additional details..."></textarea>
  
        <button type="submit">Upload</button>
      </form>
    </div>

  
    <div *ngIf="currentForm === 'appointments'" id="appointments-section">
      <p>Appointments Section Content</p>
    </div>
  </div>
