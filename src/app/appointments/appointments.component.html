<div class="appointments-container">
  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- No Appointments Message -->
  <div *ngIf="appointments.length === 0" class="no-appointments">
    No appointments available
  </div>
  
  <!-- Appointments List -->
  <div *ngFor="let appointment of appointments" class="appointment-card">
    <div class="appointment-details">
      <h3>{{ appointment.name }}</h3>
      <p>Age: {{ appointment.age }}</p>
      <p>Gender: {{ appointment.gender }}</p>
      <p>Date: {{ appointment.date }}</p>
      <p>Reason: {{ appointment.reason }}</p>
      <p>Email: {{ appointment.email }}</p>
    </div>

    <div class="appointment-actions">
      <!-- Approve Button -->
      <button 
        class="approve-button" 
        (click)="approveAppointment(appointment._id)"
        [disabled]="isApproved(appointment)"
      >
        {{ isApproved(appointment) ? 'Approved' : 'Approve' }}
      </button>

      <!-- Reschedule Input and Button -->
      <div *ngIf="isRescheduleButton(appointment)">
        <input 
          type="date" 
          [(ngModel)]="newDate" 
          (change)="onDateChange($event)" 
          placeholder="Select new date"
        />
        <button 
          class="reschedule-button" 
          (click)="rescheduleAppointment(appointment._id)" 
          [disabled]="!newDate"
        >
          Reschedule
        </button>
      </div>

      <!-- Rescheduled Status Button -->
      <button *ngIf="isRescheduled(appointment)" class="rescheduled-button" disabled>
        Rescheduled
      </button>
    </div>
  </div>
</div>
